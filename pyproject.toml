[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-reservoir-benchmark"
version = "0.1.0"
description = "A unified benchmark framework for two-reservoir cascade operation."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

authors = [
    {name = "Yafei Wang"}
]

keywords = [
    "reservoir operation",
    "hydropower",
    "dynamic programming",
    "stochastic dynamic programming",
    "deep reinforcement learning",
    "DQN",
    "benchmark",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dqn = [
    "gymnasium[classic-control]>=0.29",
    "torch>=2.0",
]

ppo = [
    "torch>=2.0",
]

dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

all = [
    "gymnasium[classic-control]>=0.29",
    "torch>=2.0",
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cascade_reservoir_benchmark*"]
