# Formal evaluation selections; DQN/PPO each use three seeds on identical inflows.
# The trade-off scan is separate and reads their validation results.
comparison:
  name: comparison_ddp_sdp_iso_dqn_ppo_formal
  output_directory: outputs/comparison_ddp_sdp_iso_dqn_ppo_formal
  physical_config: configs/xiaowan_nuozhadu_v1.yaml
  reference_guarantee_rates_pct: [80.0, 90.0]
  figure_dpi: 600

selected_results:
  DDP:
    candidate_id: penalty_200
    failure_penalty_gwh: 200.0
    trajectory: outputs/DDP/ddp_failure_penalty_1m_results_20260924/penalty_200/ddp_p4_v1_evaluation_400y_1m_interpolated_failure_count_v1.csv
    summary: outputs/DDP/ddp_failure_penalty_1m_results_20260924/penalty_200/ddp_p4_v1_evaluation_400y_1m_interpolated_failure_count_v1.json
  SDP:
    candidate_id: penalty_400
    failure_penalty_gwh: 400.0
    trajectory: outputs/SDP/evaluation/sdp/1m/bilinear_continuation/failure_penalty_400/sdp_p4_v4_one_step_forecast_bilinear_continuation_evaluation_400y_1m_failure_count_penalty_400.csv
