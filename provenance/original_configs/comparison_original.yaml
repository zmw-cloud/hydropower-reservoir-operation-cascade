  DQN:
    candidate_id: lambda_5000_mean_3seeds
    failure_penalty_gwh: 5000.0
    require_formal_evaluation: true
    archive: outputs/DQN/DQN验证集与正式训练/dqn_lambda5000_formal_3seeds.zip
    results:
      - seed: 1
        trajectory: formal_runs/seed_1/evaluation/baseline/monthly_trajectory.csv
        summary: formal_runs/seed_1/evaluation/baseline/summary.json
      - seed: 42
        trajectory: formal_runs/seed_42/evaluation/baseline/monthly_trajectory.csv
        summary: formal_runs/seed_42/evaluation/baseline/summary.json
      - seed: 100
