  ISO:
    candidate_id: rf41_teacher_penalty_500
    failure_penalty_gwh: 500.0
    trajectory: outputs/ISO/完整惩罚系数扫描最终版/iso_fixed_rf41_11penalties_complete_20261006_224932/outputs/ISO_teacher_penalty_sweep/penalty_500/evaluation/normal/iso_schedule.csv
