    failure_penalty_gwh: 6000.0
    results:
      - seed: 1
        trajectory: outputs/PPO/v16_final_lambda6000_full_20261012/outputs/xiaowan_nuozhadu/continuous_ppo_v16_geometry_conditioned_final_lambda6000/experiments/continuous_ppo_v16_geometry_conditioned_final_lambda6000/seed_1/final/evaluation/evaluation_monthly.csv
